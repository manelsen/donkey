services:
  donkey:
    build: .
    volumes:
      - ~/.donkey:/root/.donkey
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DONKEY_HOME=/root/.donkey
      - DONKEY_PG_DSN=host=postgres user=postgres password=donkey_pass dbname=donkey port=5432
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_PASSWORD: donkey_pass
      POSTGRES_DB: donkey
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
