name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev ripgrep

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'

      - name: Install Nim dependencies
        run: |
          git clone --recurse-submodules https://github.com/beef331/wasm3 /tmp/wasm3
          rm -rf /tmp/wasm3/src/wasm3/wasm3c/platforms
          (cd /tmp/wasm3 && nimble install -y)
          nimble install -y --depsOnly

      - name: Verify architectural boundaries
        run: bash scripts/check_boundaries.sh

      - name: Build Donkey binary
        run: nimble build -y

      - name: Run test suite
        run: nimble test
