name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          if ! dpkg -s libssl-dev >/dev/null 2>&1; then
            sudo apt-get update || true
            sudo apt-get install -y libssl-dev || true
          fi
          if ! command -v rg >/dev/null 2>&1; then
            # Ubuntu mirrors are a recurring transient failure in this runner.
            # ripgrep ships a static musl binary on GitHub releases.
            RG_VERSION=14.1.1
            curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/ripgrep.tar.gz
            sudo mkdir -p /opt/ripgrep
            sudo tar -xzf /tmp/ripgrep.tar.gz -C /opt/ripgrep --strip-components=1
            sudo ln -sf /opt/ripgrep/rg /usr/local/bin/rg
          fi
          command -v rg >/dev/null 2>&1 || { echo "ripgrep is required"; exit 1; }
          dpkg -s libssl-dev >/dev/null 2>&1 || { echo "libssl-dev is required"; exit 1; }

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'

      - name: Cache Nim & Nimble artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble
            ~/.cache/nim
          key: ${{ runner.os }}-nim-cache-${{ hashFiles('donkey.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nim-cache-

      - name: Install Nim dependencies
        run: |
          if [ ! -d ~/.nimble/pkgs2/wasm3* ]; then
            git clone --recurse-submodules https://github.com/beef331/wasm3 /tmp/wasm3
            rm -rf /tmp/wasm3/src/wasm3/wasm3c/platforms
            (cd /tmp/wasm3 && nimble install -y)
          fi
          nimble install -y --depsOnly

      - name: Verify architectural boundaries
        run: bash scripts/check_boundaries.sh

      - name: Build Donkey binary
        run: nimble build -y

      - name: Run test suite
        env:
          JOBS: 4
        run: nimble test
